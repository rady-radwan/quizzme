# Builds a release APK (and an App Bundle when a signing key is configured)
# and attaches them to a GitHub Release. Trigger by pushing a tag such as v1.0.0:
#   git tag v1.0.0 && git push origin v1.0.0
#
# Optional repository secrets for a properly signed production release
# (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of your upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Without them the APK is signed with the Flutter debug key: it installs fine
# for personal use but cannot be published to Google Play, and later builds
# signed with a different key cannot update it in place.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        # Explicit bash enables `-o pipefail`, so `cmd | tee log` fails when cmd fails.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install SQLite library (database tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q libsqlite3-dev

      - name: Platform folders
        run: |
          if [ ! -d android ]; then
            flutter create --org com.radyradwan --project-name quiz_me --platforms=android,ios,windows .
            rm -f test/widget_test.dart
          fi
          python3 tool/configure_platforms.py

      - name: Configure signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
              "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi

      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release --dart-define=QUIZME_GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID"
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.QUIZME_GOOGLE_WEB_CLIENT_ID }}

      - name: Build App Bundle (signed releases only)
        if: env.SIGNED == 'true'
        run: flutter build appbundle --release --dart-define=QUIZME_GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID"
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.QUIZME_GOOGLE_WEB_CLIENT_ID }}

      - name: Collect files
        run: |
          NAME="${GITHUB_REF_NAME:-manual}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/quiz-me-${NAME}.apk"
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab "dist/quiz-me-${NAME}.aab"
          fi

      - name: Remove signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          body: |
            Quiz me ${{ github.ref_name }}

            Download the .apk on your Android phone and open it to install
            (allow "Install unknown apps" for your browser or file manager).

            Signed for production: ${{ env.SIGNED }}
