# Continuous integration: static analysis, automated tests, an installable
# Android APK and a Windows installer + portable zip for every push to main.
#
# On the very first run the platform folders (android/, ios/, windows/) are
# generated with `flutter create` and committed back to main.
# Logs of every run are also published to the `ci-reports` branch
# (reports/summary.md, analyze.txt, test.txt, build.txt) for easy reading.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        # Explicit bash enables `-o pipefail`, so `cmd | tee log` fails when cmd fails.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install SQLite library (database tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q libsqlite3-dev

      - name: Prepare report folder
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          flutter --version 2>&1 | tee "$RUNNER_TEMP/reports/flutter_version.txt"

      - name: Generate platform folders if missing
        id: platforms
        run: |
          if [ ! -d android ]; then
            flutter create --org com.radyradwan --project-name quiz_me \
              --platforms=android,ios,windows . 2>&1 | tail -n 20
            rm -f test/widget_test.dart
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi
          python3 tool/configure_platforms.py

      - name: Get packages
        id: pub
        continue-on-error: true
        run: flutter pub get 2>&1 | tee "$RUNNER_TEMP/reports/pub.txt"

      - name: Analyze
        id: analyze
        if: steps.pub.outcome == 'success'
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee "$RUNNER_TEMP/reports/analyze.txt"

      - name: Test
        id: test
        if: steps.pub.outcome == 'success'
        continue-on-error: true
        run: flutter test --reporter expanded 2>&1 | tee "$RUNNER_TEMP/reports/test.txt"

      - name: Release signing key (optional repository secrets)
        # With the secrets set, every APK is signed with the same permanent key,
        # so new versions install over old ones and Google sign-in works.
        id: signing
        if: steps.pub.outcome == 'success'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
              "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
            echo "key=release" >> "$GITHUB_OUTPUT"
          else
            echo "key=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        id: apk
        if: steps.pub.outcome == 'success'
        continue-on-error: true
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.QUIZME_GOOGLE_WEB_CLIENT_ID }}
        run: |
          flutter build apk --release --dart-define=QUIZME_GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
            2>&1 | tee "$RUNNER_TEMP/reports/build.txt"

      - name: Remove signing files
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - name: Upload APK
        if: steps.apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: quiz-me-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish APK to the apk branch
        # Keeps only the latest APK (force-pushed, no history) so it can be
        # fetched with plain git, e.g. by an assistant delivering the file.
        if: steps.apk.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          D="$RUNNER_TEMP/apk-branch"
          mkdir -p "$D"
          cp build/app/outputs/flutter-apk/app-release.apk "$D/quiz-me.apk"
          printf 'Commit: %s\nRun: %s\n' "${{ github.sha }}" "${{ github.run_number }}" > "$D/BUILD.txt"
          cd "$D"
          git init -q -b apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "APK for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk

      - name: Commit generated platform folders
        if: steps.platforms.outputs.generated == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A android ios windows
          if [ -f .metadata ]; then git add .metadata; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add platform folders generated by flutter create [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish reports to ci-reports branch
        if: always() && github.event_name != 'pull_request'
        run: |
          R="$RUNNER_TEMP/reports"
          {
            echo "# CI run ${{ github.run_number }}"
            echo ""
            echo "- Commit: ${{ github.sha }}"
            echo "- pub get: ${{ steps.pub.outcome }}"
            echo "- analyze: ${{ steps.analyze.outcome }}"
            echo "- test: ${{ steps.test.outcome }}"
            echo "- apk: ${{ steps.apk.outcome }} (signing key: ${{ steps.signing.outputs.key }})"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$R/summary.md"
          if [ -f "$R/analyze.txt" ]; then grep -E "^\s*(error|warning) •" "$R/analyze.txt" > "$R/analyze_problems.txt" || true; fi
          if [ -f "$R/test.txt" ]; then grep -nE "\[E\]|FAILED|Expected:|Actual:|Error:|error:" "$R/test.txt" | head -n 400 > "$R/test_failures.txt" || true; fi
          if [ -f "$R/build.txt" ]; then tail -n 150 "$R/build.txt" > "$R/build_tail.txt"; fi
          cd "$R"
          git init -q -b ci-reports
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p reports && mv ./*.txt ./*.md reports/ 2>/dev/null || true
          git add . && git commit -q -m "CI report for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-reports

      - name: Fail if any step failed
        if: always()
        run: |
          for s in "${{ steps.pub.outcome }}" "${{ steps.analyze.outcome }}" "${{ steps.test.outcome }}" "${{ steps.apk.outcome }}"; do
            if [ "$s" != "success" ]; then echo "A required step did not succeed ($s)"; exit 1; fi
          done

  windows:
    name: Build Windows app
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows platform folder if missing
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          if [ ! -d windows ]; then
            flutter create --org com.radyradwan --project-name quiz_me --platforms=windows . 2>&1 | tail -n 20
            rm -f test/widget_test.dart
          fi
          python tool/configure_platforms.py

      - name: Build
        id: build
        continue-on-error: true
        env:
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.QUIZME_GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.QUIZME_GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          flutter pub get
          flutter build windows --release \
            --dart-define=QUIZME_GOOGLE_DESKTOP_CLIENT_ID="$GOOGLE_DESKTOP_CLIENT_ID" \
            --dart-define=QUIZME_GOOGLE_DESKTOP_CLIENT_SECRET="$GOOGLE_DESKTOP_CLIENT_SECRET" \
            2>&1 | tee "$RUNNER_TEMP/out/windows-build.txt"

      - name: Package (portable zip + installer)
        id: package
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -x
          exec > >(tee "$RUNNER_TEMP/package.log") 2>&1
          REL=build/windows/x64/runner/Release
          # App-local Visual C++ runtime, so the app starts on PCs without the redistributable.
          for d in msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do
            cp "/c/Windows/System32/$d" "$REL/" || true
          done
          VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')
          OUT="$RUNNER_TEMP/out"
          cp -r "$REL" "$OUT/Quiz me"
          (cd "$OUT" && 7z a -tzip -mx=9 QuizMe-Windows-portable.zip "Quiz me" > /dev/null)
          rm -rf "$OUT/Quiz me"
          ISCC=""
          for c in "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/c/Program Files/Inno Setup 6/ISCC.exe"; do
            if [ -f "$c" ]; then ISCC="$c"; fi
          done
          if [ -z "$ISCC" ]; then
            choco install innosetup -y --no-progress
            for c in "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/c/Program Files/Inno Setup 6/ISCC.exe"; do
              if [ -f "$c" ]; then ISCC="$c"; fi
            done
          fi
          echo "ISCC=$ISCC"
          SRC=$(cygpath -w "$PWD/$REL")
          OUTW=$(cygpath -w "$OUT")
          MSYS2_ARG_CONV_EXCL='*' "$ISCC" "/DAppVersion=$VERSION" "/DSourceDir=$SRC" "/O$OUTW" "tool\windows\installer.iss"
          ls -la "$OUT"
          test -f "$OUT/QuizMe-Setup.exe"

      - name: Upload Windows build
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: quiz-me-windows-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/out/QuizMe-Setup.exe
            ${{ runner.temp }}/out/QuizMe-Windows-portable.zip
          retention-days: 30

      - name: Publish to the windows branch
        # Latest Windows build (or its build log when it failed), force-pushed without history.
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          D="$RUNNER_TEMP/out"
          printf 'Commit: %s\nRun: %s\nBuild: %s\nPackage: %s\n' "${{ github.sha }}" "${{ github.run_number }}" \
            "${{ steps.build.outcome }}" "${{ steps.package.outcome }}" > "$D/BUILD.txt"
          if [ -f "$D/windows-build.txt" ]; then tail -n 200 "$D/windows-build.txt" > "$D/build_tail.txt"; rm "$D/windows-build.txt"; fi
          if [ -f "$RUNNER_TEMP/package.log" ]; then tail -n 200 "$RUNNER_TEMP/package.log" > "$D/package_tail.txt"; fi
          cd "$D"
          git init -q -b windows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "Windows build for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" windows

      - name: Fail if the Windows build failed
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" != "success" ] || [ "${{ steps.package.outcome }}" != "success" ]; then exit 1; fi
