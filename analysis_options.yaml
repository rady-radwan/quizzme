include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
  language:
    strict-casts: false

linter:
  rules:
    prefer_single_quotes: true
    avoid_print: true
    prefer_const_constructors: false
    prefer_const_literals_to_create_immutables: false
    use_build_context_synchronously: true
